<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisão de vídeo</title>
<style>
:root { --bg:#f4f1ea; --panel:#fff; --ink:#1a1714; --mute:#6f685d; --line:#e2ddd2; --acc:#e8541b; --ok:#2f8f5b; }
@media (prefers-color-scheme: dark) { :root { --bg:#141210; --panel:#1d1a17; --ink:#f1ece4; --mute:#a39b8e; --line:#2f2a25; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
header { display:flex; gap:12px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
header h1 { font-size:16px; margin:0 8px 0 0; }
select, button, input, textarea { font:inherit; color:inherit; }
select, input, textarea { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 10px; }
button { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer; }
button:hover { border-color:var(--acc); }
button.pri { background:var(--acc); border-color:var(--acc); color:#fff; font-weight:600; }
main { display:grid; grid-template-columns:minmax(300px,460px) 1fr; gap:20px; padding:16px; max-width:1200px; margin:0 auto; }
@media (max-width:820px) { main { grid-template-columns:1fr; } }
.player { display:flex; flex-direction:column; gap:10px; }
video { width:100%; max-height:74vh; background:#000; border-radius:14px; display:block; }
.tl { position:relative; height:34px; }
.tl input[type=range] { width:100%; margin:0; position:absolute; top:6px; left:0; }
.tick { position:absolute; top:0; width:3px; height:12px; background:var(--acc); border-radius:2px; transform:translateX(-1px); cursor:pointer; }
.tick.done { background:var(--ok); }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.time { font-variant-numeric:tabular-nums; font-weight:600; min-width:150px; }
.hint { color:var(--mute); font-size:13px; }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; }
.panel h2 { font-size:15px; margin:0 0 10px; }
textarea { width:100%; min-height:70px; resize:vertical; }
.f { display:grid; gap:8px; }
.f .r2 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
label { font-size:12px; color:var(--mute); display:block; margin-bottom:2px; }
.item { display:grid; grid-template-columns:auto 1fr auto; gap:10px; padding:10px 0; border-top:1px solid var(--line); align-items:start; }
.item:first-child { border-top:0; }
.item .t { font-variant-numeric:tabular-nums; font-weight:700; color:var(--acc); cursor:pointer; white-space:nowrap; }
.item.done .t, .item.done .txt { opacity:.5; text-decoration:line-through; }
.tag { display:inline-block; font-size:11px; padding:1px 8px; border-radius:99px; border:1px solid var(--line); color:var(--mute); margin-right:6px; }
.item .act { display:flex; gap:6px; }
.item .act button { padding:2px 8px; font-size:13px; }
#toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:8px 14px; border-radius:99px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; }
#toast.on { opacity:1; }
kbd { border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:0 5px; font-size:12px; background:var(--panel); }
</style>
</head>
<body>
<header>
  <h1>Revisão de vídeo</h1>
  <select id="vsel" title="Versão do vídeo"></select>
  <span class="hint" id="meta"></span>
  <span style="flex:1"></span>
  <button id="copy">Copiar lista (markdown)</button>
</header>
<main>
  <section class="player">
    <video id="v" playsinline preload="auto"></video>
    <div class="tl" id="tl"><input id="seek" type="range" min="0" max="1000" value="0"></div>
    <div class="row">
      <button id="play">▶︎ / ⏸</button>
      <button id="back" title="←">−1 quadro</button>
      <button id="fwd" title="→">+1 quadro</button>
      <select id="rate"><option value="1">1×</option><option value="0.5">0,5×</option><option value="0.25">0,25×</option><option value="2">2×</option></select>
      <span class="time" id="time">0,00 s</span>
    </div>
    <div class="hint"><kbd>Espaço</kbd> play/pausa · <kbd>←</kbd><kbd>→</kbd> 1 quadro (<kbd>Shift</kbd> = 1 s) · <kbd>C</kbd> comentar neste ponto · <kbd>L</kbd> repetir trecho</div>
  </section>

  <section>
    <div class="panel" style="margin-bottom:14px">
      <h2>Novo comentário</h2>
      <div class="f">
        <div class="r2">
          <div><label>Início (s)</label><input id="t0" type="number" step="0.01" min="0"></div>
          <div><label>Fim (s, opcional)</label><input id="t1" type="number" step="0.01" min="0"></div>
          <div><label>Tipo</label>
            <select id="kind"><option>geral</option><option>corte</option><option>legenda</option><option>cartão/motion</option><option>rosto/recorte</option><option>som</option><option>roteiro</option><option>cor/estilo</option></select></div>
        </div>
        <div><label>O que ajustar</label><textarea id="txt" placeholder="Ex.: a legenda está cobrindo o queixo; trocar a palavra por…; tirar este corte…"></textarea></div>
        <div class="row"><button class="pri" id="save">Salvar comentário</button><button id="cap">Usar tempo atual</button><button id="loop">Repetir trecho</button><span class="hint" id="saved"></span></div>
      </div>
    </div>
    <div class="panel">
      <h2>Comentários <span class="hint" id="count"></span></h2>
      <div id="list"></div>
    </div>
  </section>
</main>
<div id="toast"></div>
<script>
const $ = (id) => document.getElementById(id);
const v = $('v'); let video = ''; let items = []; let loopRange = null; let dirty = false;
const FPS = 60;

const fmt = (t) => { t = Math.max(0, t || 0); const m = Math.floor(t / 60); const s = t - m * 60; return (m ? m + ':' : '') + (m ? s.toFixed(2).padStart(5, '0') : s.toFixed(2)) + ' s'; };
const toast = (m) => { const e = $('toast'); e.textContent = m; e.classList.add('on'); setTimeout(() => e.classList.remove('on'), 1500); };
const uid = () => Math.random().toString(36).slice(2, 9);

async function api(path, opts) { const r = await fetch(path, opts); if (!r.ok) throw new Error(r.status); return r.json(); }

async function loadVideos() {
  const vs = await api('/api/videos');
  const sel = $('vsel'); sel.innerHTML = '';
  vs.forEach((x) => { const o = document.createElement('option'); o.value = x.path; o.textContent = `${x.path} (${(x.size / 1e6).toFixed(1)} MB)`; sel.appendChild(o); });
  const want = new URLSearchParams(location.search).get('v');
  const pre = vs.find((x) => x.path === want) || vs.find((x) => /upload\.mp4$/.test(x.path)) || vs[0];
  if (pre) { sel.value = pre.path; await openVideo(pre.path); }
  else $('meta').textContent = 'Nenhum .mp4 em exportacao/ ou work/.';
}

async function openVideo(p) {
  video = p; v.src = '/media/' + encodeURI(p);
  items = await api('/api/comments?video=' + encodeURIComponent(p));
  render(); $('meta').textContent = p;
}

async function persist() {
  await api('/api/comments', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ video, items }) });
  $('saved').textContent = 'salvo ✓ ' + new Date().toLocaleTimeString('pt-BR');
}

function render() {
  const list = $('list'); list.innerHTML = '';
  const sorted = [...items].sort((a, b) => a.t0 - b.t0);
  $('count').textContent = `(${items.filter((i) => !i.done).length} abertos / ${items.length})`;
  sorted.forEach((it) => {
    const d = document.createElement('div'); d.className = 'item' + (it.done ? ' done' : '');
    const range = it.t1 && it.t1 > it.t0 ? `${it.t0.toFixed(2)}–${it.t1.toFixed(2)}` : it.t0.toFixed(2);
    d.innerHTML = `<div class="t" title="Ir para este ponto">${range} s</div>
      <div class="txt"><span class="tag">${it.kind}</span>${esc(it.text)}</div>
      <div class="act"><button data-a="done">${it.done ? 'reabrir' : 'ok'}</button><button data-a="edit">editar</button><button data-a="del">✕</button></div>`;
    d.querySelector('.t').onclick = () => { loopRange = it.t1 > it.t0 ? [it.t0, it.t1] : null; v.currentTime = it.t0; v.pause(); };
    d.querySelector('[data-a=done]').onclick = async () => { it.done = !it.done; await persist(); render(); };
    d.querySelector('[data-a=del]').onclick = async () => { items = items.filter((x) => x.id !== it.id); await persist(); render(); };
    d.querySelector('[data-a=edit]').onclick = () => { $('t0').value = it.t0; $('t1').value = it.t1 || ''; $('kind').value = it.kind; $('txt').value = it.text; items = items.filter((x) => x.id !== it.id); persist().then(render); $('txt').focus(); };
    list.appendChild(d);
  });
  drawTicks();
}
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

function drawTicks() {
  document.querySelectorAll('.tick').forEach((e) => e.remove());
  if (!v.duration) return;
  items.forEach((it) => {
    const e = document.createElement('div'); e.className = 'tick' + (it.done ? ' done' : '');
    e.style.left = (it.t0 / v.duration * 100) + '%'; e.title = fmt(it.t0) + ' · ' + it.text;
    e.onclick = () => { v.currentTime = it.t0; };
    $('tl').appendChild(e);
  });
}

function useNow() { $('t0').value = v.currentTime.toFixed(2); }
function startComment() { v.pause(); useNow(); $('t1').value = ''; $('txt').focus(); }

async function save() {
  const text = $('txt').value.trim(); const t0 = parseFloat($('t0').value);
  if (!text || isNaN(t0)) { toast('Preencha o tempo e o comentário'); return; }
  const t1 = parseFloat($('t1').value);
  items.push({ id: uid(), t0, t1: isNaN(t1) ? null : t1, kind: $('kind').value, text, done: false, created: new Date().toISOString() });
  $('txt').value = ''; $('t1').value = '';
  await persist(); render(); toast('Comentário salvo');
}

function step(n) { v.pause(); v.currentTime = Math.min(Math.max(0, v.currentTime + n / FPS), v.duration || 1e9); }

v.addEventListener('loadedmetadata', () => { drawTicks(); });
v.addEventListener('timeupdate', () => {
  $('time').textContent = fmt(v.currentTime) + (v.duration ? ' / ' + fmt(v.duration) : '');
  if (v.duration) $('seek').value = v.currentTime / v.duration * 1000;
  if (loopRange && v.currentTime >= loopRange[1]) v.currentTime = loopRange[0];
});
$('seek').oninput = (e) => { v.currentTime = e.target.value / 1000 * v.duration; };
$('play').onclick = () => (v.paused ? v.play() : v.pause());
$('back').onclick = () => step(-1); $('fwd').onclick = () => step(1);
$('rate').onchange = (e) => { v.playbackRate = parseFloat(e.target.value); };
$('save').onclick = save; $('cap').onclick = useNow;
$('loop').onclick = () => { const a = parseFloat($('t0').value), b = parseFloat($('t1').value); if (!isNaN(a) && !isNaN(b) && b > a) { loopRange = [a, b]; v.currentTime = a; v.play(); } else { loopRange = null; toast('Informe início e fim para repetir'); } };
$('vsel').onchange = (e) => openVideo(e.target.value);
$('copy').onclick = async () => {
  const md = [`# Comentários de revisão — ${video}`, '', ...[...items].sort((a, b) => a.t0 - b.t0).map((i) => `- [${i.done ? 'x' : ' '}] ${i.t0.toFixed(2)}${i.t1 > i.t0 ? '–' + i.t1.toFixed(2) : ''} s · ${i.kind}: ${i.text}`)].join('\n');
  try { await navigator.clipboard.writeText(md); toast('Copiado'); } catch (e) { toast('Não consegui copiar'); }
};
document.addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'textarea' || tag === 'input' || tag === 'select') { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && tag === 'textarea') save(); return; }
  if (e.code === 'Space') { e.preventDefault(); v.paused ? v.play() : v.pause(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); e.shiftKey ? (v.currentTime -= 1) : step(-1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); e.shiftKey ? (v.currentTime += 1) : step(1); }
  else if (e.key === 'c' || e.key === 'C') { e.preventDefault(); startComment(); }
  else if (e.key === 'l' || e.key === 'L') { $('loop').click(); }
});
loadVideos().catch((e) => { $('meta').textContent = 'Erro: ' + e.message; });
</script>
</body>
</html>
